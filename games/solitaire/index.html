<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solitaire — Tablo</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="manifest" href="../../manifest.json">
  <link rel="stylesheet" href="../../assets/css/style.css" crossorigin>
  <link rel="stylesheet" href="styles.css?v=1" crossorigin>
  <meta name="theme-color" content="#0f1923">
</head>
<body>
  <div id="tablo-header"></div>

  <div class="game-wrapper">
    <div class="game-stats">
      <div class="stat-item">
        <span class="stat-label" data-i18n="solitaire_score">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label" data-i18n="solitaire_moves">Moves</span>
        <span class="stat-value" id="moves">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label" data-i18n="solitaire_time">Time</span>
        <span class="stat-value" id="time">00:00</span>
      </div>
    </div>

    <div class="solitaire-board" id="solitaire-board">
      <div class="top-row">
        <div class="pile stock" id="stock">
          <div class="card-back"></div>
        </div>
        <div class="pile waste" id="waste"></div>
        <div class="pile empty-slot"></div>
        <div class="foundation" id="foundation-h"></div>
        <div class="foundation" id="foundation-d"></div>
        <div class="foundation" id="foundation-c"></div>
        <div class="foundation" id="foundation-s"></div>
      </div>

      <div class="tableau" id="tableau">
        <div class="column" data-col="0"></div>
        <div class="column" data-col="1"></div>
        <div class="column" data-col="2"></div>
        <div class="column" data-col="3"></div>
        <div class="column" data-col="4"></div>
        <div class="column" data-col="5"></div>
        <div class="column" data-col="6"></div>
      </div>
    </div>

    <p class="game-hint" data-i18n="solitaire_hint">Click a card to select it, then click a destination. Click the stock to draw!</p>

    <div class="game-controls">
      <button class="game-btn primary" id="btn-new-game" data-i18n="solitaire_new_game">New Game</button>
      <button class="game-btn" id="btn-undo" data-i18n="solitaire_undo">Undo</button>
    </div>
  </div>

  <div id="tablo-footer"></div>

  <div class="tablo-toast" id="toast"></div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/header.js"></script>
  <script src="../../assets/js/footer.js"></script>
  <script>
    (function() {
      var attempts = 0;
      function loadGame() {
        var s = document.createElement('script');
        s.src = 'game.js';
        s.onload = function() {
          if (typeof window.initGame === 'function') initGame();
        };
        document.body.appendChild(s);
      }
      function check() {
        if (window.TABLO_TRANSLATIONS) { loadGame(); }
        else if (attempts < 50) { attempts++; setTimeout(check, 100); }
        else { loadGame(); }
      }
      check();
    })();
  </script>
</body>
</html>
