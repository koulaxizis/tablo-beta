<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solitaire — Tablo</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="manifest" href="../../manifest.json">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#0f1923">
</head>
<body>
  <div id="tablo-header"></div>

  <svg style="display:none" aria-hidden="true">
    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <line x1="12" y1="2" x2="12" y2="4"/>
      <line x1="12" y1="20" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="4" y2="12"/>
      <line x1="20" y1="12" x2="22" y2="12"/>
      <line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/>
      <line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/>
      <line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/>
      <line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </symbol>
  </svg>

  <div class="game-wrapper solitaire-wrapper">
    <div class="solitaire-stats">
      <div class="stat-item">
        <span class="stat-label" data-i18n="solitaire_score">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label" data-i18n="solitaire_moves">Moves</span>
        <span class="stat-value" id="moves">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label" data-i18n="solitaire_time">Time</span>
        <span class="stat-value" id="time">00:00</span>
      </div>
    </div>

    <div class="solitaire-board" id="solitaire-board">
      <div class="solitaire-toprow">
        <div class="sol-pile stock" id="stock">
          <div class="sol-cardback"></div>
        </div>
        <div class="sol-pile waste" id="waste"></div>
        <div class="sol-pile sol-empty"></div>
        <div class="sol-foundation" id="foundation-h"></div>
        <div class="sol-foundation" id="foundation-d"></div>
        <div class="sol-foundation" id="foundation-c"></div>
        <div class="sol-foundation" id="foundation-s"></div>
      </div>

      <div class="solitaire-tableau" id="tableau">
        <div class="sol-column" data-col="0"></div>
        <div class="sol-column" data-col="1"></div>
        <div class="sol-column" data-col="2"></div>
        <div class="sol-column" data-col="3"></div>
        <div class="sol-column" data-col="4"></div>
        <div class="sol-column" data-col="5"></div>
        <div class="sol-column" data-col="6"></div>
      </div>
    </div>

    <p class="solitaire-hint" data-i18n="solitaire_hint">Click a card to select it, then click a destination. Click the stock to draw!</p>

    <div class="solitaire-controls">
      <button class="game-btn primary" id="btn-new-game" data-i18n="solitaire_new_game">New Game</button>
      <button class="game-btn" id="btn-undo" data-i18n="solitaire_undo">Undo</button>
    </div>
  </div>

  <div id="tablo-footer"></div>

  <div class="solitaire-winmodal" id="winner-modal">
    <div class="solitaire-winoverlay"></div>
    <div class="solitaire-wincontent">
      <div class="solitaire-winicon" id="winner-icon">🎉</div>
      <h2 class="solitaire-wintitle" id="winner-title"></h2>
      <p class="solitaire-winmsg" id="winner-message"></p>
      <div class="solitaire-winbuttons">
        <button class="game-btn primary" id="btn-play-again" data-i18n="btn_play_again">Play Again</button>
      </div>
    </div>
  </div>

  <div class="tablo-toast" id="toast"></div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/header.js"></script>
  <script src="../../assets/js/footer.js"></script>
  <script>
    (function() {
      var attempts = 0;
      function loadGame() {
        var s = document.createElement('script');
        s.src = 'game.js';
        s.onload = function() {
          if (typeof window.initGame === 'function') initGame();
        };
        document.body.appendChild(s);
      }
      function check() {
        if (window.TABLO_TRANSLATIONS) { loadGame(); }
        else if (attempts < 50) { attempts++; setTimeout(check, 100); }
        else { loadGame(); }
      }
      check();
    })();
  </script>
</body>
</html>
